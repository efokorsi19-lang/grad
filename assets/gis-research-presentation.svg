# Beyond the Coordinates

A static graduation invitation website for Isaac Kwesi Alavi's MSc Geographic Information Systems graduation at the University of Aberdeen.

## Included

- `index.html` – the full invitation page
- `assets/gis-research-presentation.svg` – local presentation artwork used in the journey section

## Local preview

Open `index.html` directly in a browser, or serve the folder locally with a simple static server:

```bash
python -m http.server 8000
```

Then visit:

```text
http://localhost:8000
```

## Deployment

The site is static and works well with:

- Netlify
- GitHub Pages
- any static hosting provider

Upload the repository contents as-is and publish the site.

## Notes

- RSVP/contact links are included as lightweight placeholders.
- Dinner venue and time remain marked as "to be confirmed".
- The design is intentionally minimal, elegant and mobile-friendly.



























































































































































































































































































































































































