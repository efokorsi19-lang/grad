<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Presentation slide summarizing GIS demand model and network results">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#efefef"/>
      <stop offset="1" stop-color="#dfe1df"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="34" y="60" width="370" height="580" fill="#f4f4f4" stroke="#bcbcbc" stroke-width="2"/>
    <rect x="440" y="60" width="720" height="580" fill="#f0f0f0" stroke="#bcbcbc" stroke-width="2"/>
  </g>

  <g font-family="Georgia, serif" fill="#1d1d1d">
    <text x="70" y="114" font-size="34" font-style="italic">Results I - demand model and network</text>
  </g>

  <g>
    <rect x="75" y="155" width="290" height="330" fill="#eceae7" stroke="#b5b5b5"/>
    <path d="M96 445 L340 445" stroke="#ccc" stroke-width="1.5"/>
    <path d="M96 445 L340 445" stroke="#d8d8d8" stroke-width="1.5" opacity="0.7"/>
    <g opacity="0.75">
      <path d="M100 180 L270 180 L270 330 L100 330 Z" fill="none" stroke="#7e7e7e" stroke-width="1"/>
      <path d="M100 200 L270 200" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M100 220 L270 220" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M100 240 L270 240" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M100 260 L270 260" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M100 280 L270 280" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M100 300 L270 300" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M120 180 L120 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M140 180 L140 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M160 180 L160 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M180 180 L180 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M200 180 L200 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M220 180 L220 330" stroke="#8d8d8d" stroke-width="1"/>
      <path d="M240 180 L240 330" stroke="#8d8d8d" stroke-width="1"/>
