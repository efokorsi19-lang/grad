    <g fill="#848484">
      <circle cx="110" cy="310" r="2"/>
      <circle cx="130" cy="294" r="2"/>
      <circle cx="148" cy="280" r="2"/>
      <circle cx="162" cy="300" r="2"/>
      <circle cx="180" cy="250" r="2"/>
      <circle cx="210" cy="290" r="2"/>
      <circle cx="230" cy="255" r="2"/>
      <circle cx="245" cy="240" r="2"/>
      <circle cx="260" cy="270" r="2"/>
      <circle cx="200" cy="330" r="2"/>
      <circle cx="180" cy="340" r="2"/>
      <circle cx="150" cy="350" r="2"/>
      <circle cx="140" cy="240" r="2"/>
      <circle cx="210" cy="220" r="2"/>
      <circle cx="245" cy="225" r="2"/>
      <circle cx="270" cy="250" r="2"/>
    </g>

    <path d="M122 384 C150 360 175 356 210 370 C236 380 260 376 290 366 C308 360 321 340 330 328" fill="none" stroke="#979797" stroke-width="2" stroke-linecap="round"/>
    <path d="M108 300 L250 250 L280 285 L220 330 Z" fill="rgba(120,120,120,0.12)" stroke="#8e8e8e" stroke-width="1.5"/>
    <g font-family="sans-serif" font-size="11" fill="#555">
      <text x="215" y="292">Legend</text>
    </g>
  </g>

  <g font-family="sans-serif" font-size="9" fill="#3a3a3a">
    <text x="80" y="520">Population 0.37</text>
    <text x="214" y="520">Commercial 0.23</text>
    <text x="80" y="538">Education 0.14</text>
    <text x="214" y="538">Social 0.14</text>
    <text x="80" y="556">Health 0.08</text>
    <text x="214" y="556">Public service 0.04</text>
    <text x="80" y="592">Consistency ratio 0.012.</text>
  </g>

  <g fill="#0d0d0d" font-family="Georgia, serif">
    <text x="470" y="120" font-size="29" font-style="italic">ROUTABLE NETWORK</text>
  </g>

  <g fill="#1c1c1c" font-family="Georgia, serif">
    <text x="470" y="190" font-size="46" font-weight="700">2,755</text>
    <text x="590" y="190" font-size="26">bus-viable roads: filtered class-by-class;</text>
    <text x="590" y="225" font-size="26">footways, tracks and 923 service roads</text>
    <text x="590" y="260" font-size="26">excluded.</text>

    <text x="470" y="315" font-size="42" font-weight="700">76%</text>
    <text x="590" y="315" font-size="26">width-validated: a 74-segment imagery</text>
    <text x="590" y="350" font-size="26">sample against a 3.5 m carriageway rule.</text>

    <text x="470" y="405" font-size="42" font-weight="700">33 km/h</text>
    <text x="590" y="405" font-size="26">test route average — 13.0 km solved in 23.3</text>
    <text x="590" y="440" font-size="26">min, confirming the travel-time cost.</text>
  </g>

  <g>
    <rect x="470" y="470" width="540" height="110" fill="#131313"/>
    <text x="490" y="515" font-size="30" fill="#f5f5f5" font-family="Georgia, serif">Key data-quality finding</text>
    <text x="490" y="552" font-size="25" fill="#f5f5f5" font-family="Georgia, serif">OSM roads were not nodded at intersections, so the network</text>
    <text x="490" y="585" font-size="25" fill="#f5f5f5" font-family="Georgia, serif">fragmented and would not route. Feature To Line split every</text>
    <text x="490" y="618" font-size="25" fill="#f5f5f5" font-family="Georgia, serif">crossing from 2,625 to 5,829 features to restore connectivity.</text>
  </g>

  <g>
    <rect x="885" y="62" width="215" height="180" fill="#f6f5f3" stroke="#b6b6b6"/>
    <circle cx="995" cy="260" r="60" fill="none" stroke="#6d6d6d" stroke-width="2"/>
    <circle cx="995" cy="260" r="15" fill="#272727"/>
