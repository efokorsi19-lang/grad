      <text x="922" y="220">7</text>
      <text x="948" y="195">8</text>
      <text x="980" y="188">9</text>
    </g>
    <g stroke="#493d3d" stroke-width="2" fill="none">
      <path d="M995 260 L995 208"/>
      <path d="M995 260 L1038 235"/>
    </g>
  </g>

  <g>
    <rect x="850" y="640" width="180" height="100" fill="#dfe5d9"/>
    <path d="M885 670 L910 685 L938 645 L970 690 L998 660" fill="none" stroke="#4b9381" stroke-width="3" stroke-linecap="round"/>
    <circle cx="885" cy="670" r="6" fill="#0d1924"/>
    <circle cx="998" cy="660" r="6" fill="#0d1924"/>
  </g>
</svg>

